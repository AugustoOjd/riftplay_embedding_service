version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: receiver-naming
        - name: var-naming
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/AugustoOjd/riftplay_embedding_service
